configuration:
  port:
    name: Порт на уеб интерфейса
    description: >-
      Уеб интерфейсът и API на ShellyLanMan във вашата LAN мрежа (по подразбиране 3082),
      напр. http://homeassistant.local:3082. Променете го, ако друга програма на този хост
      използва 3082. Страничната лента не се нуждае от него.
  mcp_local:
    name: Локален достъп за Home Assistant без токен
    description: >-
      Предоставя MCP сървъра на ShellyLanMan и заявките на интеграцията ShellyLanMan на
      127.0.0.1 без токен, за да може Home Assistant на този хост (MCP клиентът на Assist,
      интеграцията) да ги използва, дори когато ShellyLanMan има парола. Достъпен е само
      за програми на този хост; за MCP сървърът MCP трябва да е включен в ShellyLanMan
      (Настройки → MCP) и важи неговото ниво на достъп.
  mcp_local_port:
    name: Порт на локалния достъп
    description: >-
      Портът на 127.0.0.1 за горния локален достъп (по подразбиране 8097). Променете го,
      ако друга програма на този хост използва 8097; интеграцията се настройва сама.
