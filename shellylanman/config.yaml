# ShellyLanMan as a Home Assistant app (HA OS / Supervised).
# The version is the ShellyLanMan release this app runs: the image
# ghcr.io/wimmme/shellylanman-ha:<version> is built from
# ghcr.io/wimmme/shellylanman:<version> (see COMPATIBILITY.md).
name: ShellyLanMan
version: "0.9.1"
slug: shellylanman
description: Discover, monitor and manage the Shelly devices on your LAN — locally, without the Shelly cloud.
url: https://github.com/wimmme/shellylanman
image: ghcr.io/wimmme/shellylanman-ha
arch:
  - amd64
  - aarch64
# mDNS discovery and the devices' own subnets need the host's network.
host_network: true
# The web UI in Home Assistant's sidebar, behind Home Assistant's login.
ingress: true
ingress_port: 8099
panel_icon: mdi:lan
panel_title: ShellyLanMan
# /data (settings, archive, scenes, configuration backups) goes into HA backups.
backup: hot
init: false
# Announced to Home Assistant: the ShellyLanMan integration (custom_components/
# shellylanman) and Home Assistant's own MCP client (Assist).
discovery:
  - shellylanman
  - mcp
options:
  mcp_local: true
schema:
  mcp_local: bool
