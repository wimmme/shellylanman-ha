name: Integration

# Tests of custom_components/shellylanman against the oldest supported Home
# Assistant (2026.9, voluptuous) and the newest (probatio), plus Home
# Assistant's and HACS's own validation.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read only; the release job asks for more itself.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phcc: ['0.13.367', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install
        run: |
          if [ "${{ matrix.phcc }}" = latest ]; then pip install pytest-homeassistant-custom-component
          else pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"; fi
          # Home Assistant's own Shelly integration runs in the tests (adding Shellys).
          pip install $(python tools/ha_reqs.py shelly)
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  # A GitHub release per tag (HACS needs releases, not only tags), made after the
  # tests, hassfest and the HACS validation passed; notes from both changelogs.
  release:
    needs: [tests, hassfest, hacs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
            exit 0
          fi
          sh tools/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
