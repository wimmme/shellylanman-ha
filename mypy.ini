# Strict typing (quality scale Platinum), the settings Home Assistant uses for its
# strictly typed integrations: sh tools/test.sh runs it.
[mypy]
python_version = 3.14
strict = true
warn_unreachable = true
enable_error_code = ignore-without-code, redundant-self, truthy-iterable
disallow_any_unimported = true
local_partial_types = true
strict_bytes = true
extra_checks = true
files = custom_components/shellylanman
